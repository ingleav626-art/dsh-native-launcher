name: CI

on:
  push:
    paths: ['src/**', 'tests/**', 'tools/build.mjs', 'vitest.config.ts', 'package.json', 'tsconfig.json']
  pull_request:
    paths: ['src/**', 'tests/**']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      # 端到端自测针对构建产物（伪造官方 API，无需 dsh 环境），必须在 build 之后
      - run: npm run test:e2e
