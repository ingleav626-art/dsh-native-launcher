# dsh-native-launcher bundle patch: mounts the plugin into a dsh profile.
# Install: `dsh plugin --profile web add <path-to-this-directory>`
- insert:
    - id: native-launcher
      name: dsh-native-launcher
      config:
        # 桌面快捷方式双击后执行的启动命令（在 cmd 中运行，依赖 PATH 里的 dsh）
        # --no-open：让官方 dsh web 的自动开浏览器让位（rc.8 起默认开启），
        # 避免"官方标签页 + 插件 PWA 应用窗口"双开——浏览器由插件 autoOpen 负责打开
        launchCommand: dsh --profile web --no-open
        # 启动器是否自动打开浏览器（仅当通过快捷方式启动、且设置了 DSH_LAUNCHER=1 时）
        autoOpen: true
        # 快捷方式名称（不含扩展名）
        shortcutName: DSH WebUI
        # 快捷方式已存在时是否强制覆盖（默认 false = 幂等跳过）
        force: false
        # 端口探测：已监听则直接开浏览器连上，未监听才启动（需与 webserver 端口一致）
        port: 3080
        # 系统托盘（PowerShell NotifyIcon，零依赖）：启动时拉起，含"打开 WebUI / 停止 DSH / 退出"
        tray: true
        # 打开方式：app=桌面 App 模式（默认，Chromium 系 --app 独立应用窗口：任务栏独立条目、无地址栏、图标取页面 favicon）
        #          new-window=默认浏览器独立窗口 / default=浏览器默认行为
        openMode: app
        # 关闭语义（桌面应用行为）：所有页面窗口关闭后，若没有任务在跑则优雅退出服务；
        # 有任务在跑则驻留，任务完成且仍无窗口时自动退出。false 则关窗后服务常驻。
        closeToExit: true
        # 可插拔功能模块开关（整合包架构）：缺省值来自各模块 defaultEnabled，此处显式配置优先
        modules:
          # 任务通知（WebUI 投影通知通道）
          notifications: true

